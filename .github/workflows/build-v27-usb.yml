name: GravadorTelaWin 2.7 RC3 — câmera USB como Área B

on:
  push:
    branches: [feature/v27-celular-usb-area-b]
    paths:
      - 'gravador_tela.py'
      - 'gravador_v27_dual.py'
      - 'gravador_v27_perf.py'
      - 'gravador_v27_usb_camera.py'
      - 'preparar_ambiente.py'
      - 'INSTALAR.ps1'
      - 'tests/**'
      - '.github/workflows/build-v27-usb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Dependências
        shell: pwsh
        run: python -m pip install -r requirements.txt 'pyinstaller>=6,<7'
      - name: Validar sintaxe e instalação
        shell: pwsh
        run: |
          python -m compileall -q gravador_tela.py gravador_v27_dual.py gravador_v27_perf.py gravador_v27_usb_camera.py preparar_ambiente.py
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'INSTALAR.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Regressões e testes câmera USB
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_v*.py' -v
      - name: Build Windows x64
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GravadorTelaWin_v2_7_USB_RC3 --collect-all imageio_ffmpeg --collect-all soundcard --collect-all comtypes --hidden-import comtypes --hidden-import comtypes.client gravador_tela.py
          if (!(Test-Path 'dist/GravadorTelaWin_v2_7_USB_RC3.exe')) { throw 'EXE não gerado' }
          Get-FileHash 'dist/GravadorTelaWin_v2_7_USB_RC3.exe' -Algorithm SHA256
      - name: Publicar artefato Windows para homologação
        uses: actions/upload-artifact@v4
        with:
          name: GravadorTelaWin-v2.7-RC3-CelularUSB-AreaB-Windows-x64
          path: dist/GravadorTelaWin_v2_7_USB_RC3.exe
          if-no-files-found: error
          retention-days: 30
