name: Testar e compilar GravadorTelaWin 2.2 Estúdio RC1

on:
  push:
    branches: [feature/gravador-v2-2-estudio]
    paths:
      - 'gravador_tela.py'
      - 'gravador_v22_studio.py'
      - 'gravador_v21_perf.py'
      - 'gravador_v2_utils.py'
      - 'INSTALAR.ps1'
      - 'preparar_ambiente.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/build-v22.yml'
  pull_request:
    paths:
      - 'gravador_tela.py'
      - 'gravador_v22_studio.py'
      - 'tests/**'
      - '.github/workflows/build-v22.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-studio:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Validar sintaxe Python e PowerShell
        shell: pwsh
        run: |
          python -m compileall -q gravador_tela.py gravador_v2_utils.py gravador_v21_perf.py gravador_v22_studio.py preparar_ambiente.py verificar_python.py
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'INSTALAR.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt 'pyinstaller>=6,<7'
      - name: Executar testes automatizados
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_v*.py' -v
      - name: Gerar executável Windows
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GravadorTelaWin_v2_2_ESTUDIO_PREVIA --collect-all imageio_ffmpeg --collect-all soundcard --collect-all comtypes --hidden-import comtypes --hidden-import comtypes.client gravador_tela.py
          if (!(Test-Path 'dist/GravadorTelaWin_v2_2_ESTUDIO_PREVIA.exe')) { throw 'Executável não encontrado' }
          Get-FileHash 'dist/GravadorTelaWin_v2_2_ESTUDIO_PREVIA.exe' -Algorithm SHA256
      - name: Disponibilizar RC1
        uses: actions/upload-artifact@v4
        with:
          name: GravadorTelaWin-v2.2-Estudio-RC1-Windows-x64
          path: dist/GravadorTelaWin_v2_2_ESTUDIO_PREVIA.exe
          retention-days: 30
          if-no-files-found: error
