name: GravadorTelaWin 2.7 RC5 — interface compacta e rolagem
on:
  push:
    branches: [feature/v27-ui-scroll-rc5]
    paths:
      - 'gravador_tela.py'
      - 'gravador_v27_ui.py'
      - 'tests/**'
      - 'preparar_ambiente.py'
      - 'INSTALAR.ps1'
      - '.github/workflows/build-v27-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Dependencias de compilacao
        shell: pwsh
        run: python -m pip install -r requirements.txt 'pyinstaller>=6,<7'
      - name: Validar sintaxe e instalador
        shell: pwsh
        run: |
          python -m compileall -q gravador_tela.py gravador_v27_ui.py gravador_v27_scrcpy.py preparar_ambiente.py
          $tokens = $null; $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'INSTALAR.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: Regressao v2.7
        shell: pwsh
        run: python -m unittest discover -s tests -p 'test_v*.py' -v
      - name: Compilar executavel independente Windows x64
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GravadorTelaWin_v2_7_UI_RC5 --collect-all imageio_ffmpeg --collect-all soundcard --collect-all comtypes --hidden-import comtypes --hidden-import comtypes.client gravador_tela.py
          if (!(Test-Path 'dist/GravadorTelaWin_v2_7_UI_RC5.exe')) { throw 'Executavel RC5 nao gerado' }
          Get-FileHash 'dist/GravadorTelaWin_v2_7_UI_RC5.exe' -Algorithm SHA256
      - name: Publicar executavel RC5 Windows
        uses: actions/upload-artifact@v4
        with:
          name: GravadorTelaWin-v2.7-RC5-Interface-Rolagem-Windows-x64
          path: dist/GravadorTelaWin_v2_7_UI_RC5.exe
          if-no-files-found: error
          retention-days: 30
